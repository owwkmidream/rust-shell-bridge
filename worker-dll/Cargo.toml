[package]
name = "iobitunlocker_shell_bridge_worker"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
windows = { version = "0.58.0", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
] }
windows-core = "0.58.0"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
